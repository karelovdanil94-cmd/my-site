<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A-90 RANSOM SYSTEM v2.0</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        /* Начальный экран для активации звука браузером */
        #start-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }
        #start-btn {
            background: none;
            border: 2px solid #ff3333;
            color: #ff3333;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 15px #ff3333;
            transition: 0.3s;
        }
        #start-btn:hover {
            background: #ff3333;
            color: #000;
            box-shadow: 0 0 25px #ff3333;
        }

        /* Главное окно Рэнсома */
        #ransom-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, #200000 0%, #050000 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff2222;
            z-index: 9999;
            text-align: center;
        }

        /* Эффект шума и помех на заднем плане (CRT Scanlines) */
        #ransom-screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .title {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-shadow: 3px 3px 0px #550000;
            margin-bottom: 5px;
            animation: glitch-anim 0.3s infinite alternate;
        }

        .subtitle {
            color: #888;
            font-size: 1rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .score-board {
            font-size: 1.8rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
            font-weight: bold;
        }

        /* Анимированный зловещий таймер */
        .timer-box {
            font-size: 4.5rem;
            color: #ffffff;
            background-color: #0a0000;
            border: 3px solid #ff2222;
            padding: 5px 35px;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(255, 34, 34, 0.4);
            font-weight: bold;
            animation: shake 0.5s infinite;
        }

        /* Улучшенные 3D монетки Архивов */
        .coin {
            position: absolute;
            background: radial-gradient(circle, #ffe866 0%, #d4af37 70%, #aa7c11 100%);
            border: 3px solid #5a450c;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #4a3600;
            cursor: pointer;
            box-shadow: 0 0 25px #ffd700, inset 0 0 8px rgba(255,255,255,0.6);
            z-index: 5;
            transform-origin: center;
            animation: coin-entrance 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: transform 0.1s;
        }
        .coin:active {
            transform: scale(0.8);
        }

        @keyframes coin-entrance {
            0% { transform: scale(0) rotate(-45deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Экран Скримера Хоррора */
        #screamer-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 10000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .screamer-text {
            color: #ff0000;
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 10px;
            text-align: center;
            animation: flash-red 0.05s infinite, heavy-shake 0.1s infinite;
        }

        /* --- АНИМАЦИИ ЭФФЕКТОВ --- */
        @keyframes glitch-anim {
            0% { transform: skew(1deg); filter: hue-rotate(0deg); }
            100% { transform: skew(-1deg); filter: hue-rotate(10deg); color: #ff5555; }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-1px, 1px); }
            75% { transform: translate(1px, -1px); }
        }
        @keyframes heavy-shake {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-8px, 12px) scale(1.1); }
            40% { transform: translate(10px, -8px) scale(0.95); }
            60% { transform: translate(-12px, -4px) scale(1.05); }
            80% { transform: translate(8px, 8px) scale(1); }
        }
        @keyframes flash-red {
            0%, 100% { color: #ff0000; text-shadow: 0 0 50px #ff0000; }
            50% { color: #ffffff; text-shadow: 0 0 10px #ffffff; }
        }
    </style>
</head>

                // Звук успешного клика по золоту
