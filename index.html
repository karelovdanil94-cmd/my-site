<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOORS: A-90 Room Wanderer</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Экран запуска */
        #gate-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #0f0202; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 99999;
        }
        #gate-btn {
            background: #ff2222; border: none; color: #000;
            padding: 20px 60px; font-size: 1.6rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 0 30px #ff0000; transition: 0.2s;
            letter-spacing: 2px;
        }
        #gate-btn:hover { background: #fff; box-shadow: 0 0 50px #fff; }

        /* Игровой 3D-контейнер */
        #game-viewport {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; perspective: 800px;
            background: #050505; overflow: hidden;
        }

        /* 3D Окружение комнаты */
        #room-environment {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Стены коридора комнат */
        .wall {
            position: absolute; background: #1a1512;
            border: 2px solid #0f0c0a; box-sizing: border-box;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
        }
        .wall-left { width: 1200px; height: 100vh; transform: rotateY(90deg) translateZ(-400px) translateX(-400px); }
        .wall-right { width: 1200px; height: 100vh; transform: rotateY(-90deg) translateZ(-400px) translateX(400px); left: calc(100vw - 400px); }
        .floor { width: 100vw; height: 1200px; background: #110e0c; transform: rotateX(90deg) translateZ(-200px) translateY(400px); }

        /* Дверь в конце комнаты */
        #target-door {
            position: absolute; left: 50%; top: 45%;
            width: 180px; height: 320px; background: #3a2212;
            transform: translate(-50%, -40%) translateZ(-500px);
            border: 8px solid #1a0f08; cursor: pointer;
            box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px #000;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.2s;
            z-index: 20;
        }
        #target-door:hover { transform: translate(-50%, -40%) translateZ(-480px) scale(1.03); background: #4a2d1a; }
        .door-handle { width: 15px; height: 15px; background: #cca43b; border-radius: 50%; margin-left: auto; margin-right: 20px; }

        /* Игровой интерфейс HUD */
        .game-hud {
            position: absolute; top: 30px; left: 30px; z-index: 50;
            color: #fff; background: rgba(0,0,0,0.7);
            padding: 15px 30px; border: 2px solid #555; border-radius: 4px;
            pointer-events: none;
        }
        .hud-line { font-size: 1.4rem; font-weight: bold; margin: 5px 0; }
        #room-counter { color: #aaa; }
        #wallet-counter { color: #ffd700; }

        /* Золото, разбросанное в комнате */
        .room-gold {
            position: absolute; width: 45px; height: 45px;
            background: radial-gradient(circle at 35% 35%, #fff 0%, #ffbb00 45%, #996e00 100%);
            border: 2px solid #3e2b00; border-radius: 50%;
            cursor: pointer; box-shadow: 0 0 20px #ffbb00; z-index: 30;
        }

        /* --- ИНТЕРФЕЙС БЛОКИРОВКИ РЭНСОМА (A-90) --- */
        #ransom-attack-ui {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 1000;
            background: radial-gradient(circle, #300000 0%, #0c0000 100%);
            flex-direction: column; justify-content: center; align-items: center;
        }
        .alert-title { color: #ff2222; font-size: 3.5rem; font-weight: 900; text-shadow: 0 0 25px #ff0000; letter-spacing: 5px; text-align: center; }
        .attack-stats { font-size: 2.2rem; color: #fff; margin: 20px 0; font-family: monospace; text-align: center; }
        #attack-clock { color: #ff3333; font-weight: bold; }
        #attack-score { color: #ffd700; font-weight: bold; }

        /* Кнопочные монеты Рэнсома во время атаки */
        .attack-coin {
            position: absolute; width: 70px; height: 70px;
            background: radial-gradient(circle at 35% 35%, #fff 0%, #ffcc00 45%, #aa7c11 100%);
            border: 3px solid #4a3600; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            color: #3a2a00; font-size: 1.8rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 30px #ffcc00; z-index: 1010;
        }

        /* Знак STOP */
        #stop-sign {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; height: 260px; background-color: #ff0000;
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            border: 6px solid #fff; z-index: 2000;
            justify-content: center; align-items: center;
            color: #fff; font-size: 5rem; font-weight: 900;
            box-shadow: 0 0 100px #ff0000; animation: sign-glow 0.1s infinite alternate;
        }
        @keyframes sign-glow { 0% { transform: translate(-50%, -50%) scale(0.95); } 100% { transform: translate(-50%, -50%) scale(1.05); } }

        /* Имитация BSOD */
        #bsod-screen {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh; background-color: #0078d7;
            color: #fff; z-index: 999999; box-sizing: border-box;
            padding: 10% 15%; flex-direction: column;
        }
        .sad-face { font-size: 9rem; font-weight: 300; margin-bottom: 25px; }
        .bsod-title { font-size: 2.2rem; font-weight: 300; margin-bottom: 30px; max-width: 900px; }
    </style>
</head>
<body>

    <!-- 1. Экран старта -->
    <div id="gate-screen">
        <button id="gate-btn" onclick="startGame()">ENTER THE ARCHIVES</button>
    </div>

    <!-- 2. Игровой мир хождения по комнатам -->
    <div id="game-viewport">
        <div class="game-hud">
            <div class="hud-line">ROOM: <span id="room-counter">001</span></div>
            <div class="hud-line">GOLD: <span id="wallet-counter">0</span></div>
        </div>

        <div id="room-environment">
            <div class="wall wall-left"></div>
            <div class="wall wall-right"></div>
            <div class="floor"></div>
            <div id="target-door" onclick="tryOpenDoor()">
                <div class="door-handle"></div>
            </div>
        </div>
    </div>

    <!-- 3. Экран атаки Рэнсома (A-90) -->
    <div id="ransom-attack-ui">
        <div class="alert-title">A-90 PROTOCOL: MOTION DETECTED</div>
        <div class="attack-stats">
            TIME: <span id="attack-clock">8.0</span> | 
            FEE PAID: <span id="attack-score">0 / 5</span>
        </div>
    </div>

    <!-- Знак STOP -->
    <div id="stop-sign">STOP</div>

    <!-- Синий экран смерти -->
    <div id="bsod-screen">
        <div class="sad-face">:(</div>
        <div class="bsod-title">На вашем ПК возникла проблема, и его необходимо перезагрузить. Мы лишь собираем некоторые сведения об ошибке.</div>
        <div style="font-size: 1.1rem; opacity: 0.8;">Код остановки: A90_ROOM_STALKER_EVENT</div>
    </div>

    <script>
        let currentRoom = 1;
        let totalGold = 0;
        let isMovingAnimation = false;

        let attackActive = false;
        let attackTime = 8.0;
        let attackScore = 0;
        const attackTarget = 5;
        let isStopSignActive = false;

        let attackLoop, stopTimer;
        let audioCtx = null;

        function playSound(freq, type, duration, vol) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e) {
                console.log("Audio block error:", e);
            }
        }

        function startGame() {
            document.getElementById('gate-screen').style.display = 'none';
            document.getElementById('game-viewport').style.display = 'block';
            
            playSound(100, 'sine', 0.5, 0.4);
            generateRoomLoot();
        }

        function generateRoomLoot() {
            const oldGolds = document.querySelectorAll('.room-gold');
            oldGolds.forEach(g => g.remove());

            if (Math.random() < 0.7) {
                const gold = document.createElement('div');
                gold.className = 'room-gold';
                
                gold.style.left = `${Math.random() * 40 + 30}%`;
                gold.style.top = `${Math.random() * 20 + 65}%`;

                gold.onclick = function(e) {
                    e.stopPropagation();
                    totalGold++;
                    document.getElementById('wallet-counter').innerText = totalGold;
                    playSound(900, 'sine', 0.08, 0.3);
                    gold.remove();
                };
                document.getElementById('game-viewport').appendChild(gold);
            }
        }

        function tryOpenDoor() {
            if (isMovingAnimation || attackActive) return;
            isMovingAnimation = true;
            playSound(250, 'triangle', 0.2, 0.5);

            const env = document.getElementById('room-environment');
            env.style.transform = 'scale(2.5) translateZ(400px)';

            setTimeout(() => {
                env.style.transition = 'none';
                env.style.transform = 'scale(1) translateZ(0)';
                
                setTimeout(() => {
                    env.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1)';
                    currentRoom++;
                    document.getElementById('room-counter').innerText = String(currentRoom).padStart(3, '0');
                    isMovingAnimation = false;

                    generateRoomLoot();
                    
                    let attackChance = 0.25 + (currentRoom * 0.03);
                    if (Math.random() < attackChance) {
                        triggerRansomAttack();
                    }
                }, 50);
            }, 600);
        }

        function triggerRansomAttack() {
            attackActive = true;
            attackTime = 8.0;
            attackScore = 0;
            isStopSignActive = false;
            
            document.getElementById('attack-score').innerText = `0 / ${attackTarget}`;
            document.getElementById('ransom-attack-ui').style.display = 'flex';
            
            playSound(55, 'sawtooth', 1.2, 0.8);

            attackLoop = setInterval(() => {
                attackTime -= 0.1;
                if (attackTime <= 0) {
                    attackTime = 0;
                    triggerBsofCrash();
                }
                document.getElementById('attack-clock').innerText = attackTime.toFixed(1);
            }, 100);

            spawnAttackCoin();
            startStopSignMechanic();
        }

        function spawnAttackCoin() {
            if (!attackActive) return;
            const current = document.querySelector('.attack-coin');
            if (current) current.remove();

            const coin = document.createElement('div');
            coin.className = 'attack-coin';
            coin.innerText = '⛃';

            const space = 120;
            const x = Math.random() * (window.innerWidth - space * 2) + space;
            const y = Math.random() * (window.innerHeight - space * 2) + space;
            coin.style.left = `${x}px`;
            coin.style.top = `${y}px`;

            coin.onclick = function(e) {
                e.stopPropagation();
                if (isStopSignActive) {
                    triggerBsofCrash();
                    return;
                }

                attackScore++;
                document.getElementById('attack-score').innerText = `${attackScore} / ${attackTarget}`;
                playSound(1000, 'sine', 0.1, 0.4);
                coin.remove();

                if (attackScore >= attackTarget) {
                    bypassRansom();
                } else {
                    spawnAttackCoin();
                }
            };

            document.body.appendChild(coin);
        }

        function startStopSignMechanic() {
            if (!attackActive) return;

            stopTimer = setTimeout(() => {
                if (!attackActive) return;

                isStopSignActive = true;
                document.getElementById('stop-sign').style.display = 'flex';
                playSound(140, 'square', 0.3, 0.6);

                setTimeout(() => {
                    isStopSignActive = false;
                    document.getElementById('stop-sign').style.display = 'none';
                    startStopSignMechanic();
                }, 1100);

            }, Math.random() * 1500 + 1500);
        }

        window.addEventListener('mousemove', () => {
            if (attackActive && isStopSignActive) {
                triggerBsofCrash();
            }
        });

        function bypassRansom() {
            endAttackCleanup();
            playSound(440, 'sine', 0.4, 0.5);
            document.getElementById('ransom-attack-ui').style.display = 'none';
        }

        function triggerBsofCrash() {
            endAttackCleanup();
            playSound(40, 'sawtooth', 2.5, 1.0);
            playSound(80, 'square', 2.0, 0.8);

            document.getElementById('game-viewport').style.display = 'none';
            document.getElementById('ransom-attack-ui').style.display = 'none';
            document.getElementById('stop-sign').style.display = 'none';
            document.getElementById('bsod-screen').style.display = 'flex';

            setTimeout(() => {
                location.reload();
            }, 5000);
        }

        function endAttackCleanup() {
            attackActive = false;
            isStopSignActive = false;
            clearInterval(attackLoop);
            clearTimeout(stopTimer);
            const coin = document.querySelector('.attack-coin');
            if (coin) coin.remove();
        }
    </script>
</body>
</html>
