<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер Сфера Эволюции</title>
    <style>
        body { font-family: sans-serif; background: #0a0f1d; color: #fff; margin: 0; padding: 20px; user-select: none; }
        .main-box { background: #111827; max-width: 500px; margin: 0 auto 20px auto; padding: 20px; border-radius: 16px; border: 2px solid #00f6ff; text-align: center; box-shadow: 0 0 15px rgba(0,246,255,0.2); }
        .money { font-size: 40px; font-weight: bold; color: #00f6ff; margin: 10px 0; }
        .sphere { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(#00f6ff, #7303c0); margin: 15px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 50px; box-shadow: 0 0 20px #00f6ff; transition: transform 0.05s; }
        .sphere:active { transform: scale(0.93); }
        .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1300px; margin: 0 auto; }
        .col { background: #1f2937; padding: 15px; border-radius: 12px; border: 1px solid #374151; max-height: 55vh; overflow-y: auto; }
        .col h3 { margin-top: 0; border-bottom: 2px solid #374151; padding-bottom: 5px; }
        .card { background: rgba(255,255,255,0.05); margin: 8px 0; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; text-align: left; }
        .card-info { max-width: 70%; }
        .card-cost { color: #38bdf8; font-weight: bold; font-size: 12px; margin-top: 2px; }
        .btn { background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #4b5563; color: #9ca3af; cursor: not-allowed; }
        .action-btn { background: #10b981; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }
        .leader-box { max-width: 600px; margin: 25px auto; background: #111827; border: 2px solid #38bdf8; border-radius: 12px; padding: 15px; text-align: left; box-shadow: 0 0 15px rgba(56,189,248,0.1); }
        .leader-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 10px; }
        .leader-table th, .leader-table td { padding: 8px; text-align: left; border-bottom: 1px solid #374151; }
        .leader-table th { color: #38bdf8; }
        .me { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-box">
        <h2>🌌 Кибер Сфера Эволюции</h2>
        <div>Уровень: <span id="lvl">1</span> | Перерождения: <span id="reb">0</span></div>
        <div class="money"><span id="bal">0</span> 💰</div>
        <div style="font-size: 13px; color: #9ca3af;">Клик: +<span id="clk">1</span> | Авто: +<span id="cps">0</span>/с</div>
        <div id="core" class="sphere" onclick="tClick()">⭐</div>
        <button class="action-btn" id="rBtn" onclick="doReb()">✨ Перерождение (Цена: 15К 💰)</button>
        <button class="action-btn" style="background:#ef4444;" onclick="resetG()">Сброс</button>
    </div>

    <div class="columns">
        <div class="col" style="border-top: 3px solid #00f6ff;">
            <h3 style="color:#00f6ff;">⚡ Апгрейды клика</h3>
            <div id="t1"></div>
        </div>
        <div class="col" style="border-top: 3px solid #ec38bc;">
            <h3 style="color:#ec38bc;">🤖 Роботы (Авто)</h3>
            <div id="t2"></div>
        </div>
        <div class="col" style="border-top: 3px solid #f59e0b;">
            <h3 style="color:#f59e0b;">🎨 Скины сферы</h3>
            <div id="t3"></div>
        </div>
    </div>

    <div class="leader-box">
        <h3 style="margin:0; color:#00f6ff; text-align: center;">🏆 Таблица Лидеров Игроков</h3>
        <table class="leader-table">
            <thead>
                <tr><th>Место</th><th>Игрок</th><th>Баланс монет</th></tr>
            </thead>
            <tbody id="leadBody"></tbody>
        </table>
    </div>

    <script>
        const names = {
            u: ["Дата-кабель","Микрочип","Модуль ОЗУ","Процессор","Видеокарта","Блок лазера","Схема питания","Фотонный луч","Квантовый узел","Материя ядро","Модуль ИИ","ДНК-цепочка","Сингулярность","Космос-буст","Импульс X"],
            r: ["Бот-Дрон","Майнер","ИИ-Ассистент","Серверная станция","Ядерный генератор","Фабрика дронов","Нексус узел","Кибер-Завод","Главный Сервер","Облачная база","Ядро сети","Матрица авто","ИИ-Контроллер","Мега-Дроид","Суперкомпьютер"]
        };
        const skins = [
            {n:"Изумруд",e:"🟢",b:"#047857",c:100},{n:"Золото",e:"👑",b:"#b45309",c:300},{n:"Магма",e:"🔥",b:"linear-gradient(#f97316,#b91c1c)",c:1000},{n:"Лёд",e:"❄️",b:"linear-gradient(#06b6d4,#1d4ed8)",c:5000},{n:"Космос",e:"🌌",b:"#03001e",c:12000},
            {n:"Рубин",e:"🔴",b:"#b91c1c",c:25000},{n:"Сапфир",e:"🔷",b:"#1d4ed8",c:60000},{n:"Аметист",e:"🔮",b:"#6d28d9",c:120000},{n:"Затмение",e:"🌑",b:"#111827",c:300000},{n:"Радуга",e:"🌈",b:"linear-gradient(to right,red,orange,yellow,green,blue,violet)",c:800000},
            {n:"Матрица",e:"📟",b:"linear-gradient(#111,#047857)",c:2000000},{n:"Спектр",e:"👁️",b:"#4c0519",c:5000000},{n:"Пустота",e:"🌀",b:"#000",c:15000000},{n:"Агент",e:"🕵️‍♂️",b:"#1e1b4b",c:50000000},{n:"Король Сети",e:"👑",b:"#701a75",c:200000000}
        ];

        let nick = localStorage.getItem('v_nick');
        if (!nick) {
            nick = prompt("Введите ваш никнейм для Кибер-Таблицы:") || "Игрок_" + Math.floor(Math.random()*100);
            localStorage.setItem('v_nick', nick);
        }

        let coins = Number(localStorage.getItem('v_c')) || 0;
        let clickPower = Number(localStorage.getItem('v_p')) || 1;
        let autoIncome = Number(localStorage.getItem('v_a')) || 0;
        let lvl = Number(localStorage.getItem('v_l')) || 1;
        let reb = Number(localStorage.getItem('v_r')) || 0;
        let clks = Number(localStorage.getItem('v_k')) || 0;
        let curSkin = localStorage.getItem('v_se') || '⭐';
        let curBg = localStorage.getItem('v_sb') || 'radial-gradient(#00f6ff, #7303c0)';

        let uPrices = JSON.parse(localStorage.getItem('v_pu')) || Array.from({length:15},(_,i)=>Math.floor(10*Math.pow(2.9,i)));
        let rPrices = JSON.parse(localStorage.getItem('v_pp')) || Array.from({length:15},(_,i)=>Math.floor(20*Math.pow(3.0,i)));
        let ownedSkins = JSON.parse(localStorage.getItem('v_so')) || [];

        function buildShops() {
            let h1 = ''; names.u.forEach((name, i) => { let v = (i+1)*1; h1 += `<div class="card"><div class="card-info"><b>${name}</b> (+${v})<div class="card-cost" id="u_c_${i}">Цена: ${uPrices[i]}</div></div><button class="btn" id="u_b_${i}" onclick="buy('u',${i},${v})">Купить</button></div>`; });
            document.getElementById('t1').innerHTML = h1;
            let h2 = ''; names.r.forEach((name, i) => { let v = (i+1)*2; h2 += `<div class="card"><div class="card-info"><b>${name}</b> (+${v}/с)<div class="card-cost" id="p_c_${i}">Цена: ${rPrices[i]}</div></div><button class="btn" id="p_b_${i}" onclick="buy('r',${i},${v})">Купить</button></div>`; });
            document.getElementById('t2').innerHTML = h2;
            let h3 = ''; skins.forEach((s, i) => { h3 += `<div class="card"><div class="card-info"><b>${s.n}</b> [${s.e}]<div class="card-cost">Цена: ${s.c}</div></div><button class="btn" id="s_b_${i}" onclick="buySkin(${i})">Купить</button></div>`; });
            document.getElementById('t3').innerHTML = h3;
        }

        function tClick() {
            coins += clickPower * (reb > 0 ? reb * 2 : 1); clks++;
            if (clks >= lvl * 50) { lvl++; clks = 0; clickPower += 2; alert("🎉 Уровень повышен!"); }
            save(); ui();
        }

        function buy(type, i, val) {
            let arr = type === 'u' ? uPrices : rPrices;
            if (coins >= arr[i]) {
                coins -= arr[i];
                if (type === 'u') clickPower += val; else autoIncome += val;
                arr[i] = Math.floor(arr[i] * 1.45);
                save(); ui();
            }
        }

        function buySkin(i) {
            let s = skins[i]; if (ownedSkins.includes(i)) { curSkin = s.e; curBg = s.b; applySkin(); save(); return; }
            if (coins >= s.c) { coins -= s.c; ownedSkins.push(i); curSkin = s.e; curBg = s.b; applySkin(); save(); ui(); }
        }

        function applySkin() { let c = document.getElementById('core'); c.innerText = curSkin; c.style.background = curBg; }
        
        function doReb() {
            if (coins >= 15000) {
                reb++; coins = 0; clickPower = 1; autoIncome = 0; lvl = 1; clks = 0;
                uPrices = Array.from({length:15},(_,i)=>Math.floor(10*Math.pow(2.9,i))); rPrices = Array.from({length:15},(_,i)=>Math.floor(20*Math.pow(3.0,i)));
                save(); ui(); alert("✨ Перерождение успешно!");
            }
        }

        function save() {
            localStorage.setItem('v_c', coins); localStorage.setItem('v_p', clickPower); localStorage.setItem('v_a', autoIncome); localStorage.setItem('v_l', lvl); localStorage.setItem('v_r', reb); localStorage.setItem('v_k', clks); localStorage.setItem('v_se', curSkin); localStorage.setItem('v_sb', curBg);
            localStorage.setItem('v_pu', JSON.stringify(uPrices)); localStorage.setItem('v_pp', JSON.stringify(rPrices)); localStorage.setItem('v_so', JSON.stringify(ownedSkins));
            updateLeaderboard();
        }

        function resetG() { localStorage.clear(); location.reload(); }

        function ui() {
