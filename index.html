<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рэнсом (A-90) - Вымогательство</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            user-select: none;
        }

        /* Экран блокировки Рэнсома */
        #ransom-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #2a0000 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ff3333;
            z-index: 9999;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px #ff0000;
            margin-bottom: 5px;
            animation: glitch 0.2s infinite alternate;
        }

        /* Счетчик собранного золота */
        .score-board {
            font-size: 1.5rem;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ffd700;
        }

        /* Таймер */
        .timer-box {
            font-size: 3.5rem;
            color: #ffffff;
            background-color: #111;
            border: 3px solid #ff3333;
            padding: 5px 25px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.5);
            margin-bottom: 30px;
        }

        /* Стилизация монеток Рэнсома */
        .coin {
            position: absolute;
            width: 60px;
            height: 60px;
            background-color: #ffd700;
            border: 4px solid #b8860b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 20px #ffd700;
            animation: coin-spawn 0.15s ease-out;
            user-select: none;
        }

        .coin:hover {
            transform: scale(1.1);
            background-color: #fff;
        }

        @keyframes coin-spawn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Экран Скримера */
        #screamer-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ff0000;
            color: #fff;
            font-size: 4rem;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            animation: flash 0.05s infinite;
        }

        @keyframes flash {
            0% { background-color: #ff0000; color: #000; }
            50% { background-color: #000000; color: #ff0000; }
            100% { background-color: #ff0000; color: #000; }
        }
    </style>
</head>
<body>

    <div id="ransom-screen">
        <div class="title">РЭНСОМ / A-90</div>
        <div class="score-board">СОБЕРИТЕ ЗОЛОТО: <span id="coins-collected">0</span> / 5</div>
        <div class="timer-box" id="timer">10.0</div>
    </div>

    <div id="screamer-screen" id="screamer">
        YOU DIDN'T PAY!!!
    </div>

    <script>
        // Настройки мини-игры
        let timeLeft = 10.0; // Время на сбор монет (в секундах)
        let coinsCollected = 0;
        const targetCoins = 5;
        let coinInterval;

        const timerElement = document.getElementById('timer');
        const ransomScreen = document.getElementById('ransom-screen');
        const screamerScreen = document.getElementById('screamer-screen');
        const scoreElement = document.getElementById('coins-collected');

        // Обратный отсчет таймера с точностью до десятых долей секунды
        const countdown = setInterval(() => {
            timeLeft -= 0.1;
            if (timeLeft <= 0) {
                timeLeft = 0;
                clearInterval(countdown);
                clearInterval(coinInterval);
                triggerScreamer();
            }
            timerElement.innerText = timeLeft.toFixed(1);
        }, 1000);

        // Функция генерации монеты в случайном месте экрана
        function spawnCoin() {
            // Удаляем старую монету, если она еще осталась на экране
            const oldCoin = document.querySelector('.coin');
            if (oldCoin) oldCoin.remove();

            const coin = document.createElement('div');
            coin.className = 'coin';
            coin.innerText = '⛃'; // Символ монетки

            // Случайные координаты (с отступами, чтобы не вылезали за края)
            const padding = 80;
            const x = Math.random() * (window.innerWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - padding * 2) + padding;

            coin.style.left = `${x}px`;
            coin.style.top = `${y}px`;

            // Обработка клика по монете
            coin.onclick = function() {
                coinsCollected++;
                scoreElement.innerText = coinsCollected;
                coin.remove();

                if (coinsCollected >= targetCoins) {
                    victory();
                } else {
                    // Сразу спавним следующую при клике
                    spawnCoin();
                }
            };

            ransomScreen.appendChild(coin);
        }

        // Запускаем постоянный спавн монет (раз в 1.2 секунды, если игрок тормозит)
        spawnCoin();
        coinInterval = setInterval(spawnCoin, 1200);

        // Успешный откуп
        function victory() {
            clearInterval(countdown);
            clearInterval(coinInterval);
            const activeCoin = document.querySelector('.coin');
            if (activeCoin) activeCoin.remove();
            
            ransomScreen.style.display = 'none';
            alert('Вы откупились от Рэнсома. Золото успешно собрано.');
        }

        // Проигрыш и скример (YOU DIDN'T PAY!)
        function triggerScreamer() {
            ransomScreen.style.display = 'none';
            screamerScreen.style.display = 'flex';
            
            setTimeout(() => {
                location.reload(); // Перезапуск страницы
            }, 3500);
        }
    </script>
</body>
</html>
