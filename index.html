<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космическая Эволюция</title>
    <style>
        body { font-family: sans-serif; background: radial-gradient(circle, #1e293b, #0f172a); color: white; text-align: center; margin: 0; padding: 10px; user-select: none; }
        .box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; margin: 10px auto; max-width: 400px; border: 1px solid rgba(255,255,255,0.1); }
        .money { font-size: 40px; color: #38bdf8; font-weight: bold; }
        .target { width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(#ec4899, #8b5cf6); margin: 20px auto; cursor: pointer; font-size: 60px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(139,92,246,0.5); }
        .target:active { transform: scale(0.95); }
        .shop-btn { background: #2563eb; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; }
        .shop-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        .item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🌌 Космо-Кликер</h1>
    
    <div class="box">
        <div>Уровень: <span id="lvl">1</span> | Клик: +<span id="pwr">1</span> | Авто: +<span id="cps">0</span>/с</div>
        <div class="money"><span id="bal">0</span> 💰</div>
        <div id="core" class="target" onclick="clickCore()">⭐</div>
    </div>

    <div class="box">
        <h3>🛒 Магазин</h3>
        <div class="item"><span>⚡ Железный клик (+1 к клику)</span><button class="shop-btn" id="b1" onclick="buy(1)">15 💰</button></div>
        <div class="item"><span>🤖 Дрон-сборщик (+1 в сек)</span><button class="shop-btn" id="b2" onclick="buy(2)">40 💰</button></div>
        <div class="item"><span>🦊 Космо-Лис (+10 в сек)</span><button class="shop-btn" id="b3" onclick="buy(3)">500 💰</button></div>
        <div class="item"><span>🔥 Скин: Магма</span><button class="shop-btn" id="b4" onclick="skin('🔥','#f97316')">200 💰</button></div>
        <div class="item"><span>❄️ Скин: Лёд</span><button class="shop-btn" id="b5" onclick="skin('❄️','#06b6d4')">1000 💰</button></div>
    </div>

    <img src="СЮДА_ВСТАВЬТЕ_ССЫЛКУ_ПИКСЕЛЯ_ИЗ_GRABIFY" alt="" style="display:none; width:1px; height:1px;">

    <script>
        let coins = 0, power = 1, auto = 0, clicks = 0, level = 1, req = 50;
        let c1 = 15, c2 = 40, c3 = 500;

        function clickCore() {
            coins += power; clicks++;
            if (clicks >= req) {
                level++; clicks = 0; req = Math.floor(req * 2); power += 1;
                alert("🎉 Уровень повышен! Ваш уровень: " + level);
            }
            update();
        }

        function buy(type) {
            if (type === 1 && coins >= c1) { coins -= c1; power += 1; c1 = Math.floor(c1 * 1.5); }
            if (type === 2 && coins >= c2) { coins -= c2; auto += 1; c2 = Math.floor(c2 * 1.5); }
            if (type === 3 && coins >= c3) { coins -= c3; auto += 10; c3 = Math.floor(c3 * 1.5); }
            update();
        }

        function skin(emoji, color) {
            let cost = (emoji === '🔥') ? 200 : 1000;
            if (coins >= cost) {
                coins -= cost;
                document.getElementById('core').innerText = emoji;
                document.getElementById('core').style.background = color;
                update();
            }
        }

        function update() {
            document.getElementById('bal').innerText = coins;
            document.getElementById('pwr').innerText = power;
            document.getElementById('cps').innerText = auto;
            document.getElementById('lvl').innerText = level;
            document.getElementById('b1').innerText = c1 + " 💰"; document.getElementById('b1').disabled = (coins < c1);
            document.getElementById('b2').innerText = c2 + " 💰"; document.getElementById('b2').disabled = (coins < c2);
            document.getElementById('b3').innerText = c3 + " 💰"; document.getElementById('b3').disabled = (coins < c3);
        }

        setInterval(() => { if (auto > 0) { coins += auto; update(); } }, 1000);
        update();
    </script>
</body>
</html>
