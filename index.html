<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOORS: A-90 Room Wanderer (Canvas Fixed)</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Состояния игры: 'START', 'ROOM', 'RANSOM', 'BSOD'
        let gameState = 'START';
        let currentRoom = 1;
        let totalGold = 0;

        // Координаты интерактивных объектов для 100% точного клика
        let activeDoor = null;
        let activeRoomCoin = null;
        let activeAttackCoin = null;

        // Тайминги и параметры А-90
        let attackTime = 8.0;
        let attackScore = 0;
        const attackTarget = 5;
        let isStopActive = false;

        let lastTime = 0;
        let stopTimer = 0;
        let stopToggleTime = 0;

        // Аудио подсистема синтеза частот (без блокировок внешних файлов)
        let audioCtx = null;
        function playSound(freq, type, duration, vol) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            calculateClickZones();
        }

        function calculateClickZones() {
            // Кнопка Старта
            const btnW = 320, btnH = 70;
            activeStartBtn = { x: (canvas.width - btnW)/2, y: (canvas.height - btnH)/2, w: btnW, h: btnH };

            // Дверь в комнате
            const doorW = 160, doorH = 280;
            activeDoor = { x: (canvas.width - doorW)/2, y: (canvas.height - doorH)/2 - 20, w: doorW, h: doorH };
        }

        function spawnRoomCoin() {
            if (Math.random() < 0.75) {
                const r = 22;
                const minX = canvas.width * 0.2, maxX = canvas.width * 0.8;
                const minY = canvas.height * 0.65, maxY = canvas.height * 0.85;
                activeRoomCoin = {
                    x: Math.random() * (maxX - minX) + minX,
                    y: Math.random() * (maxY - minY) + minY,
                    r: r
                };
            } else {
                activeRoomCoin = null;
            }
        }

        function spawnAttackCoin() {
            const r = 32;
            const space = 100;
            activeAttackCoin = {
                x: Math.random() * (canvas.width - space * 2) + space,
                y: Math.random() * (canvas.height - space * 2) + space,
                r: r
            };
        }

        function triggerRansom() {
            gameState = 'RANSOM';
            attackTime = 8.0;
            attackScore = 0;
            isStopActive = false;
            stopToggleTime = performance.now() + Math.random() * 1500 + 1500;
            playSound(55, 'sawtooth', 1.2, 0.7);
            spawnAttackCoin();
        }

        function triggerBSOD() {
            gameState = 'BSOD';
            playSound(40, 'sawtooth', 2.5, 1.0);
            playSound(85, 'square', 2.0, 0.8);
            setTimeout(() => { location.reload(); }, 6000);
        }

        // --- ЕДИНЫЙ ЦИКЛ РИСОВАНИЯ (100% производительность) ---
        function loop(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameState === 'START') {
                // Фон
                ctx.fillStyle = '#0f0202';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Кнопка
                ctx.fillStyle = '#ff2222';
                ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000';
                ctx.fillRect(activeStartBtn.x, activeStartBtn.y, activeStartBtn.w, activeStartBtn.h);
                ctx.shadowBlur = 0;
                // Текст
                ctx.fillStyle = '#000000';
                ctx.font = 'bold 22px Segoe UI';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText('ENTER THE ARCHIVES', canvas.width/2, canvas.height/2);

            } else if (gameState === 'ROOM') {
                // Стены и 3D Перспектива на 2D плоскости
                ctx.fillStyle = '#110e0c';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#1a1512';
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(activeDoor.x - 100, activeDoor.y - 50);
                ctx.lineTo(activeDoor.x - 100, activeDoor.y + activeDoor.h + 100);
                ctx.lineTo(0, canvas.height); ctx.fill();

                ctx.beginPath();
                ctx.moveTo(canvas.width, 0); ctx.lineTo(activeDoor.x + activeDoor.w + 100, activeDoor.y - 50);
                ctx.lineTo(activeDoor.x + activeDoor.w + 100, activeDoor.y + activeDoor.h + 100);
                ctx.lineTo(canvas.width, canvas.height); ctx.fill();

                // Дверь
                ctx.fillStyle = '#3a2212';
                ctx.strokeStyle = '#1a0f08'; ctx.lineWidth = 6;
                ctx.fillRect(activeDoor.x, activeDoor.y, activeDoor.w, activeDoor.h);
                ctx.strokeRect(activeDoor.x, activeDoor.y, activeDoor.w, activeDoor.h);
                
                // Ручка
                ctx.fillStyle = '#cca43b';
                ctx.beginPath(); ctx.arc(activeDoor.x + activeDoor.w - 25, activeDoor.y + activeDoor.h/2, 8, 0, Math.PI*2); ctx.fill();

                // Монетка в комнате
                if (activeRoomCoin) {
                    ctx.fillStyle = 'gold'; ctx.shadowBlur = 15; ctx.shadowColor = 'gold';
                    ctx.beginPath(); ctx.arc(activeRoomCoin.x, activeRoomCoin.y, activeRoomCoin.r, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#4a3600'; ctx.font = 'bold 16px Arial';
                    ctx.fillText('⛃', activeRoomCoin.x, activeRoomCoin.y);
                }

                // HUD
                ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(30, 30, 220, 95);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 20px Segoe UI'; ctx.textAlign = 'left';
                ctx.fillText(`ROOM: ${String(currentRoom).padStart(3, '0')}`, 50, 60);
                ctx.fillStyle = 'gold';
                ctx.fillText(`GOLD: ${totalGold}`, 50, 95);

            } else if (gameState === 'RANSOM') {
                // Таймер отсчета
                if (lastTime) {
                    let dt = (timestamp - lastTime) / 1000;
                    attackTime -= dt;
                    if (attackTime <= 0) { attackTime = 0; triggerBSOD(); }
                }

                // Логика знака STOP
                if (timestamp > stopToggleTime) {
                    isStopActive = !isStopActive;
                    if (isStopActive) {
                        playSound(140, 'square', 0.3, 0.6);
                        stopToggleTime = timestamp + 1100; // Держится 1.1 секунду
                    } else {
                        stopToggleTime = timestamp + Math.random() * 1500 + 1500; // Пауза 1.5 - 3 сек
                    }
                }

                // Красный фон тревоги
                ctx.fillStyle = '#0c0000'; ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Окно предупреждения
                ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4;
                ctx.fillRect(canvas.width/2 - 300, 50, 600, 160);
                ctx.strokeRect(canvas.width/2 - 300, 50, 600, 160);

                ctx.fillStyle = '#ff2222'; ctx.font = 'bold 28px monospace'; ctx.textAlign = 'center';
                ctx.fillText('A-90 PROTOCOL: RANSOM', canvas.width/2, 95);
                ctx.fillStyle = '#fff'; ctx.font = '22px monospace';
                ctx.fillText(`TIME: ${attackTime.toFixed(1)}s | PAID: ${attackScore}/${attackTarget}`, canvas.width/2, 150);

                // Атакующая монета Рэнсома
                if (activeAttackCoin) {
                    ctx.fillStyle = 'gold'; ctx.shadowBlur = 25; ctx.shadowColor = 'yellow';
                    ctx.beginPath(); ctx.arc(activeAttackCoin.x, activeAttackCoin.y, activeAttackCoin.r, 0, Math.PI*2); ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#3a2a00'; ctx.font = 'bold 28px Arial';
                    ctx.fillText('⛃', activeAttackCoin.x, activeAttackCoin.y);
                }

                // Знак STOP
                if (isStopActive) {
                    const sz = 240;
                    const cx = canvas.width/2, cy = canvas.height/2 + 80;
                    ctx.fillStyle = 'red'; ctx.strokeStyle = 'white'; ctx.lineWidth = 6;
                    ctx.shadowBlur = 50; ctx.shadowColor = 'red';
                    ctx.beginPath();
                    for (let i = 0; i < 8; i++) {
                        let angle = (i * Math.PI / 4) + Math.PI / 8;
                        ctx.lineTo(cx + sz/2 * Math.cos(angle), cy + sz/2 * Math.sin(angle));
                    }
                    ctx.closePath(); ctx.fill(); ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'white'; ctx.font = 'bold 55px Arial';
                    ctx.fillText('STOP', cx, cy);
                }

            } else if (gameState === 'BSOD') {
                ctx.fillStyle = '#0078d7'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
                ctx.font = '110px Segoe UI'; ctx.fillText(':(', canvas.width * 0.15, canvas.height * 0.25);
                ctx.font = '26px Segoe UI';
                ctx.fillText('На вашем ПК возникла проблема, и его необходимо перезагрузить.', canvas.width * 0.15, canvas.height * 0.43);
                ctx.fillText('Мы лишь собираем некоторые сведения об ошибке, а затем система перезапустится.', canvas.width * 0.15, canvas.height * 0.48);
                ctx.font = '16px Segoe UI'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.fillText('Код остановки: A90_ROOM_STALKER_EVENT', canvas.width * 0.15, canvas.height * 0.6);
            }

            lastTime = timestamp;
            requestAnimationFrame(loop);
        }

        // --- ОБРАБОТКА ХОДА И КЛИКОВ (100% НАДЕЖНОСТЬ БЕЗ ПЕРЕКРЫТИЙ) ---
        window.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (gameState === 'START') {
                if (mouseX >= activeStartBtn.x && mouseX <= activeStartBtn.x + activeStartBtn.w &&
                    mouseY >= activeStartBtn.y && mouseY <= activeStartBtn.y + activeStartBtn.h) {
                    gameState = 'ROOM';
                    playSound(100, 'sine', 0.5, 0.4);
                    spawnRoomCoin();
                }
            } else if (gameState === 'ROOM') {
                // Проверка клика по монетке в комнате
                if (activeRoomCoin) {
                    let dist = Math.hypot(mouseX - activeRoomCoin.x, mouseY - activeRoomCoin.y);
                    if (dist <= activeRoomCoin.r) {
                        totalGold++;
                        playSound(900, 'sine', 0.08, 0.3);
                        activeRoomCoin = null;
                        return; // Предотвращаем клик сквозь монету на дверь
                    }
                }
                // Проверка клика по двери
                if (mouseX >= activeDoor.x && mouseX <= activeDoor.x + activeDoor.w &&
                    mouseY >= activeDoor.y && mouseY <= activeDoor.y + activeDoor.h) {
                    playSound(250, 'triangle', 0.15, 0.5);
                    currentRoom++;
                    spawnRoomCoin();
                    
                    // Шанс появления А-90 возрастает
                    let chance = 0.25 + (currentRoom * 0.03);
                    if (Math.random() < chance) {
                        triggerRansom();
                    }
                }
            } else if (gameState === 'RANSOM') {
                if (isStopActive) { triggerBSOD(); return; }

                if (activeAttackCoin) {
                    let dist = Math.hypot(mouseX - activeAttackCoin.x, mouseY - activeAttackCoin.y);
                    if (dist <= activeAttackCoin.r) {
                        attackScore++;
                        playSound(1000, 'sine', 0.1, 0.4);
                        if (attackScore >= attackTarget) {
                            gameState = 'ROOM';
                            playSound(440, 'sine', 0.4, 0.5);
                        } else {
                            spawnAttackCoin();
                        }
                    }
                }
            }
        });

        // Детекция движения мыши во время знака STOP
        window.addEventListener('mousemove', (e) => {
            if (gameState === 'RANSOM' && isStopActive) {
                // Если игрок двигает мышь при знаке STOP — мгновенный краш
                if (Math.abs(e.movementX) > 1 || Math.abs(e.movementY) > 1) {
                    triggerBSOD();
                }
            }
        });

        window.addEventListener('resize', resize);
        resize();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
