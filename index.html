<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВНИМАНИЕ! СИСТЕМА ЗАБЛОКИРОВАНА</title>
    <style>
        /* Оформление в стиле темных комнат DOORS */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #d11a2a; /* Кроваво-красный цвет текста */
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .screen {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            border: 3px solid #d11a2a;
            box-shadow: 0 0 20px rgba(209, 26, 42, 0.5);
            background: #111;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: blink 1s infinite alternate;
        }

        .timer {
            font-size: 4rem;
            font-weight: bold;
            color: #fff;
            margin: 20px 0;
            text-shadow: 0 0 10px #d11a2a;
        }

        .btn {
            background-color: #d11a2a;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #ff2a3b;
            box-shadow: 0 0 15px #ff2a3b;
        }

        /* Анимация мигания заголовка */
        @keyframes blink {
            0% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="screen">
        <h1>Система заблокирована</h1>
        <p>Вы потревожили сущность из DOORS. До полного удаления файлов осталось:</p>
        
        <!-- Таймер обратного отсчета -->
        <div class="timer" id="countdown">05:00</div>
        
        <p>Для отмены отправьте 100 робуксов.</p>
        <button class="btn" id="payBtn">Заплатить выкуп</button>
    </div>

    <script>
        // 1. Таймер обратного отсчета (5 минут)
        let time = 300; 
        const timerElement = document.getElementById('countdown');

        const interval = setInterval(() => {
            let minutes = Math.floor(time / 60);
            let seconds = time % 60;
            
            // Красивое форматирование 00:00
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerElement.textContent = `${minutes}:${seconds}`;

            if (time <= 0) {
                clearInterval(interval);
                timerElement.textContent = "ПОТРАЧЕНО";
                alert("Время истекло! (Шутка, ваш ПК в порядке :)");
            }
            time--;
        }, 1000);

        // 2. Безопасный выход по кнопке "Заплатить"
        document.getElementById('payBtn').addEventListener('click', () => {
            alert("Выкуп принят! Возвращаем вас на главную.");
            window.location.href = "https://google.com"; // Уведите юзера на любую страницу
        });

        // 3. Защита от закрытия вкладки (Браузер покажет предупреждение)
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = ''; // Включает стандартное окно "Вы уверены, что хотите уйти?"
        });
    </script>

</body>
</html>
