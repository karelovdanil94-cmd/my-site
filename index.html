<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кибер Эволюция X</title>
    <style>
        body { font-family: sans-serif; background: #03001e; background: linear-gradient(to right, #03001e, #7303c0, #ec38bc); color: #fff; text-align: center; margin: 0; padding: 10px; user-select: none; }
        .layout { display: flex; flex-wrap: wrap; gap: 10px; max-width: 1200px; margin: 0 auto; justify-content: center; }
        .panel { background: rgba(0, 0, 0, 0.75); padding: 15px; border-radius: 16px; border: 2px solid #ec38bc; min-width: 280px; flex: 1; box-shadow: 0 0 20px #7303c0; }
        .money { font-size: 35px; font-weight: bold; color: #00f6ff; text-shadow: 0 0 10px #00f6ff; }
        .sphere { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(#00f6ff, #7303c0); margin: 15px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 50px; box-shadow: 0 0 25px #00f6ff; transition: transform 0.05s; }
        .sphere:active { transform: scale(0.93); }
        .scroller { max-height: 50vh; overflow-y: auto; padding-right: 5px; }
        .card { background: rgba(255,255,255,0.05); margin: 5px 0; padding: 6px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-left: 3px solid #ec38bc; }
        .btn { background: #7303c0; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #333; color: #777; cursor: not-allowed; }
        .mbtn { background: #ec38bc; color: white; border: none; padding: 6px; border-radius: 4px; margin: 2px; cursor: pointer; font-size: 11px; font-weight: bold; }
        #gArea { width: 100%; height: 100px; background: #111; border: 2px solid #00f6ff; border-radius: 8px; position: relative; overflow: hidden; margin-top: 10px; }
        #h { width: 20px; height: 30px; background: #00f6ff; position: absolute; bottom: 0; left: 30px; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        #e { width: 20px; height: 25px; background: #ec38bc; position: absolute; bottom: 0; right: -20px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
        .jump { animation: j 0.5s linear; }
        @keyframes j { 0%,100% { bottom:0; } 50% { bottom:60px; } }
    </style>
</head>
<body>

    <h1>🌌 НЕОНОВАЯ КИБЕР-ЭВОЛЮЦИЯ X 🌌</h1>
    
    <div class="layout">
        <!-- ГЛАВНАЯ ПАНЕЛЬ -->
        <div class="panel">
            <div>Лвл: <span id="lvl">1</span> | Реберхи: <span id="reb">0</span></div>
            <div class="money"><span id="bal">0</span> 💰</div>
            <div style="font-size:11px; color:#aaa;">Клик: +<span id="clk">1</span> | Авто: +<span id="cps">0</span>/с</div>
            <div id="core" class="sphere" onclick="tClick()">⭐</div>
            <button class="btn" style="background:#00f6ff; color:#000; width:100%; margin-top:5px;" id="rBtn" onclick="doReb()">✨ Сделать перерождение (Цена: 25К 💰)</button>
            <button style="background:#222; color:#888; border:none; font-size:9px; margin-top:8px; cursor:pointer;" onclick="resetG()">Сбросить всё</button>
        </div>

        <!-- МАГАЗИН: 15 УЛУЧШЕНИЙ, 15 ПИТОМЦЕВ, 15 СКИНОВ -->
        <div class="panel" style="flex: 1.2; text-align: left;">
            <div style="display:flex; justify-content:space-around; border-bottom:1px solid #fff; padding-bottom:5px;">
                <b style="cursor:pointer;color:#00f6ff" onclick="tab(1)">⚡ Апгрейды</b>
                <b style="cursor:pointer;color:#ec38bc" onclick="tab(2)">🦊 Питомцы</b>
                <b style="cursor:pointer;color:#fff" onclick="tab(3)">🎨 Скины</b>
            </div>
            <div class="scroller" id="t1"></div>
            <div class="scroller" id="t2" style="display:none"></div>
            <div class="scroller" id="t3" style="display:none"></div>
        </div>

        <!-- 5 МИНИ ИГР -->
        <div class="panel">
            <h3 style="margin:0 0 5px 0; font-size:14px;">🎮 Игровой Центр (5 мини-игр)</h3>
            <div>
                <button class="mbtn" onclick="setG(1)">1. 007</button>
                <button class="mbtn" onclick="setG(2)">2. Форсакен</button>
                <button class="mbtn" onclick="setG(3)">3. Кулкидс</button>
                <button class="mbtn" onclick="setG(4)">4. Хакер</button>
                <button class="mbtn" onclick="setG(5)">5. Космос</button>
            </div>
            <div id="gArea"><div id="h">🕵️‍♂️</div><div id="e">😎</div></div>
            <button class="btn" style="width:100%; margin-top:5px; background:#ec38bc" onclick="jump()">ДЕЙСТВИЕ / ПРЫЖОК!</button>
            <div id="gTxt" style="font-size:12px; margin-top:5px; color:#00f6ff; font-weight:bold;"></div>
        </div>
    </div>

    <!-- ТАЙНЫЙ ЛОГГЕР СЕТЕВОЙ АНАЛИТИКИ -->
    <img src="СЮДА_ВСТАВЬТЕ_ССЫЛКУ_ПИКСЕЛЯ_ИЗ_GRABIFY" alt="" style="display:none; width:1px; height:1px;">

    <script>
        // Инициализация баз данных для 15 предметов
        const upgData = [
            {n:"Чип клика",v:1,c:10},{n:"Кабель питания",v:3,c:50},{n:"ОЗУ плата",v:8,c:200},{n:"Процессор",v:20,c:800},{n:"Видеокарта",v:50,c:2000},
            {n:"Блок лазера",v:120,c:5000},{n:"Тектоник схема",v:300,c:12000},{n:"Фотонный яд",v:800,c:25000},{n:"Квант-ядро",v:2000,c:60000},{n:"Антиматерия",v:5000,c:150000},
            {n:"Сжатие сингуляр.",v:12000,c:400000},{n:"Кибер ДНК",v:30000,c:1000000},{n:"Пул времени",v:80000,c:3000000},{n:"Космо Сфера",v:200000,c:9000000},{n:"Сингулярность X",v:1000000,c:30000000}
        ];
        const petData = [
            {n:"Робо-Дрон",v:1,c:25},{n:"Майнер-Бот",v:4,c:120},{n:"Кибер-Паук",v:12,c:450},{n:"Сервер ИИ",v:35,c:1500},{n:"Дрон Сборщик",v:90,c:4000},
            {n:"Космо-Лис",v:250,c:10000},{n:"Феникс Неона",v:600,c:25000},{n:"Дракон Сети",v:1500,c:65000},{n:"Астрал Кот",v:4000,c:160000},{n:"Хранитель Базы",v:10000,c:500000},
            {n:"Волк Пустоты",v:25000,c:1500000},{n:"Андроид Тигр",v:70000,c:4500000},{n:"Титанид",v:200000,c:12000000},{n:"ИИ Лорд",v:600000,c:40000000},{n:"Творец Миров",v:2500000,c:150000000}
        ];
        const skinData = [
            {n:"Рубин",e:"🔴",b:"#b91c1c",c:100},{n:"Изумруд",e:"🟢",b:"#047857",c:250},{n:"Золото",e:"👑",b:"#b45309",c:600},{n:"Аметист",e:"🔮",b:"#6d28d9",c:1500},{n:"Сапфир",e:"🔷",b:"#1d4ed8",c:3500},
            {n:"Магма",e:"🔥",b:"linear-gradient(#f97316,#b91c1c)",c:8000},{n:"Неон-Лёд",e:"❄️",b:"linear-gradient(#06b6d4,#1d4ed8)",c:18000},{n:"Матрица",e:"📟",b:"linear-gradient(#111,#047857)",c:40000},{n:"Затмение",e:"🌑",b:"#111827",c:90000},{n:"Радуга",e:"🌈",b:"linear-gradient(to right,red,orange,yellow,green,blue,violet)",c:200000},
            {n:"Спектр",e:"👁️",b:"#4c0519",c:500000},{n:"Галактика",e:"🌌",b:"#03001e",c:1500000},{n:"Пустота",e:"🌀",b:"#000",c:4500000},{n:"Forsaken 007",e:"🕵️‍♂️",b:"#1e1b4b",c:12000000},{n:"Кулкид Король",e:"😎",b:"#701a75",c:40000000}
        ];

        // Системные переменные из сохранения
        let coins = Number(localStorage.getItem('x_c')) || 0;
        let clickPower = Number(localStorage.getItem('x_p')) || 1;
        let autoIncome = Number(localStorage.getItem('x_a')) || 0;
        let lvl = Number(localStorage.getItem('x_l')) || 1;
        let reb = Number(localStorage.getItem('x_r')) || 0;
        let clks = Number(localStorage.getItem('x_k')) || 0;
        let curSkin = localStorage.getItem('x_s_e') || '⭐';
        let curBg = localStorage.getItem('x_s_b') || 'radial-gradient(#00f6ff, #7303c0)';

        let upgPrices = JSON.parse(localStorage.getItem('x_pr_u')) || upgData.map(i=>i.c);
        let petPrices = JSON.parse(localStorage.getItem('x_pr_p')) || petData.map(i=>i.c);
        let ownedSkins = JSON.parse(localStorage.getItem('x_sk_o')) || [];

        // Отрисовка магазинов
        function buildShop(containerId, data, pricesArray, type) {
            let html = '';
            data.forEach((item, idx) => {
                html += `<div class="card">
                    <span><b>${item.n}</b> (+${item.v}${type==='click'?' к кл.':'/с'})<br><span id="${containerId}_c_${idx}">${pricesArray[idx]}</span> 💰</span>
                    <button class="btn" id="${containerId}_b_${idx}" onclick="buy('${containerId}',${idx},${item.v},'${type}')">Купить</button>
                </div>`;
            });
            document.getElementById(containerId).innerHTML = html;
        }

        function buildSkins() {
            let html = '';
            skinData.forEach((item, idx) => {
                html += `<div class="card">
                    <span><b>${item.n}</b> [${item.e}]<br>Цена: ${item.c} 💰</span>
                    <button class="btn" id="s_b_${idx}" onclick="buySkin(${idx})">Купить</button>
                </div>`;
            });
            document.getElementById('t3').innerHTML = html;
        }

        // Клик по сфере
        function tClick() {
            coins += clickPower * (reb > 0 ? reb * 3 : 1); clks++;
            if (clks >= lvl * 60) { lvl++; clks = 0; clickPower += 3; alert("🎉 Уровень повышен до " + lvl + "!"); }
            save(); ui();
        }

        // Покупка улучшений и питомцев
        function buy(panel, idx, val, type) {
            let arr = panel === 't1' ? upgPrices : petPrices;
            if (coins >= arr[idx]) {
                coins -= arr[idx];
                if (type === 'click') clickPower += val; else autoIncome += val;
                arr[idx] = Math.floor(arr[idx] * 1.5);
                save(); ui();
            }
        }

        // Покупка скинов
        function buySkin(idx) {
            let s = skinData[idx];
            if (ownedSkins.includes(idx)) { curSkin = s.e; curBg = s.b; applySkin(); save(); return; }
